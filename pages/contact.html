<p>Looking to reach out? Please leave a message and I'll try to get back to you as soon as possible.</p>

<form action="https://formspree.io/f/{{site.formspree.contact}}" method="POST">

    <div class="row">
        <div class="medium-6 columns">
            <label>Name
                <input type="text" name="name" placeholder="Your Name" required>
            </label>
        </div>

        <div class="medium-6 columns">
            <label>E-mail
                <input type="email" name="_replyto" placeholder="your-email@example.com" required>
            </label>
        </div>
    </div>

    <div class="row">
        <div class="medium-12 columns">
            <label>Message
                <textarea name="message" rows="8" placeholder="Your message..." required></textarea>
            </label>
        </div>
    </div>

    <input type="submit" value="Send Message" class="button">

</form>
