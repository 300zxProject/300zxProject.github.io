<p>Looking to reach out? Send a message below and I’ll get back to you as soon as possible.</p>

<form action="https://formspree.io/f/{{ site.formspree.contact }}" method="POST" accept-charset="UTF-8">

    <p>
        <label for="contact-name">Name</label><br>
        <input id="contact-name" type="text" name="name" required>
    </p>

    <p>
        <label for="contact-email">Email</label><br>
        <input id="contact-email" type="email" name="email" required>
    </p>

    <p>
        <label for="contact-message">Message</label><br>
        <textarea id="contact-message" rows="8" name="message" required></textarea>
    </p>

    <input type="hidden" name="_subject" value="300zx Project Contact Form">

    <button class="btn btn--primary" type="submit">Send</button>

</form>
